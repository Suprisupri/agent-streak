[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Allow forge scripts to write the factory calldata / init-code artifacts.
fs_permissions = [{ access = "read-write", path = "./" }]

# BSC mainnet (chain 56) — for dry-runs only; broadcasting needs owner approval.
[rpc_endpoints]
bsc = "https://bsc-dataseed.binance.org"
bsc_testnet = "https://data-seed-prebsc-1-s1.binance.org:8545"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
